<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="extName">Website Permission Auditor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- ===== Header: site identity + at-a-glance verdict ===== -->
    <header class="header">
      <div class="header__aurora" aria-hidden="true"></div>

      <div class="header__row">
        <span class="identity" id="avatar">
          <img id="favicon" class="identity__img" alt="" src="" hidden />
          <span class="identity__initial" id="siteInitial" aria-hidden="true"></span>
        </span>

        <span class="identity__text">
          <span id="siteName" class="identity__name" data-i18n="loading"
            >Loading&hellip;</span
          >
          <span id="siteUrl" class="identity__url" hidden></span>
        </span>

        <span id="summaryBadge" class="badge" hidden></span>

        <!-- Theme preference: System / Light / Dark. Wired + persisted by
             popup.js, which resolves the choice onto <html data-theme>. -->
        <div
          id="themeToggle"
          class="theme-toggle"
          role="group"
          aria-label="Color theme"
          data-i18n-aria="themeGroupLabel"
        >
          <button
            class="theme-toggle__btn"
            type="button"
            data-theme-value="system"
            aria-pressed="true"
            title="Follow system theme"
            aria-label="Follow system theme"
            data-i18n-title="themeSystem"
            data-i18n-aria="themeSystem"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <rect x="2.8" y="4.2" width="18.4" height="12.6" rx="2.6" />
              <path d="M9 20.4h6M12 16.8v3.6" />
            </svg>
          </button>
          <button
            class="theme-toggle__btn"
            type="button"
            data-theme-value="light"
            aria-pressed="false"
            title="Light theme"
            aria-label="Light theme"
            data-i18n-title="themeLight"
            data-i18n-aria="themeLight"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4.3" />
              <path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" />
            </svg>
          </button>
          <button
            class="theme-toggle__btn"
            type="button"
            data-theme-value="dark"
            aria-pressed="false"
            title="Dark theme"
            aria-label="Dark theme"
            data-i18n-title="themeDark"
            data-i18n-aria="themeDark"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M20.4 14.1A8.5 8.5 0 0 1 9.9 3.6a8.5 8.5 0 1 0 10.5 10.5Z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Proportional bar: granted / blocked / on-ask (popup.js sizes it) -->
      <div class="meter" id="meter" hidden aria-hidden="true">
        <span class="meter__seg meter__seg--granted" id="meterGranted"></span>
        <span class="meter__seg meter__seg--blocked" id="meterBlocked"></span>
        <span class="meter__seg meter__seg--default" id="meterDefault"></span>
      </div>

      <!-- At-a-glance tally of the audit (populated by popup.js) -->
      <div class="tally" id="statStrip" hidden>
        <span class="tally__item tally__item--granted">
          <span class="tally__value" id="statGranted">0</span>
          <span class="tally__label" data-i18n="statGranted">Granted</span>
        </span>
        <span class="tally__item tally__item--blocked">
          <span class="tally__value" id="statBlocked">0</span>
          <span class="tally__label" data-i18n="statBlocked">Blocked</span>
        </span>
        <span class="tally__item tally__item--default">
          <span class="tally__value" id="statDefault">0</span>
          <span class="tally__label" data-i18n="statDefault">On ask</span>
        </span>
      </div>

      <p id="summaryText" class="header__summary"></p>
    </header>

    <main id="content">
      <!-- Shown until the first audit render lands (popup.js hides it) -->
      <div class="skeleton" id="skeleton" aria-hidden="true">
        <div class="skeleton__card">
          <span class="skeleton__row"></span>
          <span class="skeleton__line skeleton__line--wide"></span>
          <span class="skeleton__line"></span>
        </div>
        <div class="skeleton__card">
          <span class="skeleton__row"></span>
          <span class="skeleton__line skeleton__line--wide"></span>
        </div>
      </div>

      <!-- Live filter: narrows the permission rows as you type (popup.js) -->
      <div class="search" id="searchBar" hidden>
        <svg class="search__icon" viewBox="0 0 16 16" aria-hidden="true">
          <circle
            cx="7"
            cy="7"
            r="4.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path
            d="M10.4 10.4 14 14"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="permSearch"
          class="search__input"
          type="search"
          placeholder="Filter permissions…"
          data-i18n-placeholder="filterPlaceholder"
          autocomplete="off"
          spellcheck="false"
          aria-label="Filter permission rows"
          data-i18n-aria="filterLabel"
          aria-controls="categories"
        />
        <button
          id="searchClear"
          class="search__clear"
          type="button"
          aria-label="Clear filter"
          data-i18n-aria="filterClear"
          hidden
        >
          ✕
        </button>
      </div>

      <!-- One-click site presets: bulk-apply a permission profile across the
           audited content settings below. The whole batch is recorded as a
           single undoable entry. Buttons are built from PRESETS in popup.js. -->
      <section
        class="presets"
        id="presets"
        role="group"
        aria-label="Site permission presets"
        data-i18n-aria="presetsGroupLabel"
        hidden
      >
        <span class="presets__title" data-i18n="presetsTitle">Apply a profile</span>
        <div class="presets__row" id="presetsRow"></div>

        <!-- Profile backup: download the saved custom profiles as JSON, or
             merge them back from a previously exported file. Wired by
             popup.js; no network request is involved. -->
        <div
          class="presets__tools"
          role="group"
          aria-label="Profile backup"
          data-i18n-aria="presetsToolsLabel"
        >
          <button
            class="presets__tool"
            id="presetExportBtn"
            type="button"
            title="Download your custom profiles as a JSON file"
            data-i18n="presetsExport"
            data-i18n-title="presetsExportTitle"
          >
            Export
          </button>
          <button
            class="presets__tool"
            id="presetImportBtn"
            type="button"
            title="Add custom profiles from a JSON file"
            data-i18n="presetsImport"
            data-i18n-title="presetsImportTitle"
          >
            Import
          </button>
          <input
            id="presetImportInput"
            class="presets__file"
            type="file"
            accept="application/json,.json"
            hidden
          />
          <span
            id="presetIOText"
            class="presets__io"
            role="status"
            aria-live="polite"
          ></span>
        </div>

        <!-- Duplicate review: shown when an imported file carries profiles
             whose label already exists, so the user picks replace / keep both
             / cancel before anything is written. Wired by popup.js. -->
        <div
          class="presets__review"
          id="presetImportReview"
          role="region"
          aria-label="Import review"
          data-i18n-aria="presetsImportReviewLabel"
          hidden
        >
          <span
            class="presets__review-text"
            id="presetImportReviewText"
            role="status"
            aria-live="polite"
          ></span>
          <!-- Per-profile breakdown of every clashing label: the saved values
               vs the incoming ones, so the difference is visible before the
               user picks replace / keep both. Built by popup.js. -->
          <div class="presets__review-list" id="presetImportReviewList"></div>
          <div class="presets__review-actions">
            <button
              class="presets__tool"
              id="presetImportReplaceBtn"
              type="button"
              data-i18n="presetsImportReplace"
            >
              Replace
            </button>
            <button
              class="presets__tool"
              id="presetImportSkipBtn"
              type="button"
              data-i18n="presetsImportSkip"
            >
              Keep both
            </button>
            <button
              class="presets__tool"
              id="presetImportCancelBtn"
              type="button"
              data-i18n="presetsImportCancel"
            >
              Cancel
            </button>
          </div>
        </div>

        <!-- Confirmation panel: lists the exact rows a preset would change
             before anything is written. Built by popup.js. -->
        <div
          class="preset-preview"
          id="presetPreview"
          role="region"
          aria-label="Preset preview"
          data-i18n-aria="presetPreviewLabel"
          aria-live="polite"
          tabindex="-1"
          hidden
        ></div>

        <!-- Custom preset editor: name + a per-permission target, saved to
             chrome.storage.local and rendered alongside the built-ins.
             Built and wired by popup.js. -->
        <div
          class="preset-editor"
          id="presetEditor"
          role="region"
          aria-label="Custom preset editor"
          data-i18n-aria="presetEditorLabel"
          tabindex="-1"
          hidden
        >
          <label class="preset-editor__field">
            <span class="preset-editor__field-label" data-i18n="presetNameLabel"
              >Preset name</span
            >
            <input
              id="presetName"
              class="preset-editor__input"
              type="text"
              maxlength="24"
              autocomplete="off"
              spellcheck="false"
              placeholder="My profile"
              data-i18n-placeholder="presetNamePlaceholder"
            />
          </label>
          <ul class="preset-editor__list" id="presetEditorList"></ul>
          <div class="preset-editor__actions">
            <button
              class="preset-editor__save"
              id="presetSaveBtn"
              type="button"
              data-i18n="presetSave"
            >
              Save preset
            </button>
            <button
              class="preset-editor__cancel"
              id="presetCancelBtn"
              type="button"
              data-i18n="presetCancel"
            >
              Cancel
            </button>
          </div>
        </div>
      </section>

      <!-- Site-wide reset + one-step undo of the last change (popup.js) -->
      <div class="actions-bar" id="actionsBar" hidden>
        <div class="undo" id="undoBar" role="status" hidden>
          <span class="undo__text" id="undoText"></span>
          <button class="undo__btn" id="undoBtn" type="button" data-i18n="undo">
            Undo
          </button>
        </div>
        <button
          class="reset-site"
          id="resetSiteBtn"
          type="button"
          data-i18n="resetSite"
        >
          Reset this site
        </button>
      </div>

      <!-- "All clear" state -->
      <section id="allClear" class="all-clear" hidden>
        <span class="all-clear__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M12 2.6 4.8 5.6v6c0 4.9 3 8.6 7.2 9.9 4.2-1.3 7.2-5 7.2-9.9v-6L12 2.6Z" />
            <path d="m8.8 11.9 2.3 2.3 4.3-4.6" />
          </svg>
        </span>
        <strong class="all-clear__title" data-i18n="allClearTitle">All clear</strong>
        <span class="all-clear__sub" data-i18n="allClearSub"
          >No special permissions granted to this site.</span
        >
      </section>

      <!-- Permission categories are rendered here by popup.js -->
      <div id="categories"></div>

      <!-- Shown when a filter matches nothing -->
      <p id="noResults" class="no-results" role="status" hidden></p>

      <!-- Shown only for chrome://, extension pages, etc. -->
      <section id="notAuditable" class="notice notice--warn" hidden>
        <strong data-i18n="notAuditableTitle">Nothing to audit here</strong>
        <span id="notAuditableReason" data-i18n="notAuditableDefault"
          >This page is a browser or extension page, so it has no website
          permissions.</span
        >
      </section>
    </main>

    <footer class="footer">
      <span class="footer__hint">
        <span data-i18n="footerHint">Audits only this tab's site settings.</span>
        <span class="footer__version" id="versionChip" hidden></span>
      </span>
      <a
        id="chromeSettingsLink"
        class="footer__link"
        href="#"
        data-i18n="chromeSettingsLink"
        >Chrome settings ↗</a
      >
    </footer>

    <template id="tpl-category">
      <section class="card">
        <button
          class="card__head"
          type="button"
          aria-expanded="true"
          aria-controls=""
        >
          <span class="card__icon" aria-hidden="true"></span>
          <h2 class="card__title"></h2>
          <span class="card__count" aria-hidden="true"></span>
          <span class="card__chevron" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14" focusable="false">
              <path
                d="M4 6l4 4 4-4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </button>
        <div class="card__list-wrap">
          <ul class="card__list" id=""></ul>
        </div>
      </section>
    </template>

    <template id="tpl-item">
      <li class="perm">
        <span class="perm__glyph" aria-hidden="true"></span>
        <div class="perm__body">
          <div class="perm__row">
            <span class="perm__name"></span>
            <span class="perm__value"></span>
          </div>
          <span class="perm__detail"></span>
          <!-- Enable / Disable toggle this permission; Reset restores the
               browser default. Wired by popup.js. -->
          <div class="perm__actions">
            <button
              class="perm__action perm__action--allow"
              type="button"
              data-action="allow"
              aria-pressed="false"
              data-i18n="enable"
            >
              Enable
            </button>
            <button
              class="perm__action perm__action--block"
              type="button"
              data-action="block"
              aria-pressed="false"
              data-i18n="disable"
            >
              Disable
            </button>
            <button
              class="perm__action perm__action--reset"
              type="button"
              data-action="reset"
              data-i18n="reset"
              hidden
            >
              Reset
            </button>
          </div>
        </div>
      </li>
    </template>

    <script src="popup.js"></script>
  </body>
</html>
